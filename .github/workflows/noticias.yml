name: Actualizar noticias

on:
  schedule:
    # 11:00 UTC = 8:00 en Argentina (GitHub puede demorarla unos minutos)
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Actualizar titulares
        run: python3 scripts/actualizar_noticias.py

      - name: Guardar y publicar
        run: |
          if git diff --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "SM Estudio Contable"
          git config user.email "smestudiocontablecat@gmail.com"
          git commit -am "Actualiza noticias $(TZ=America/Argentina/Buenos_Aires date +%d/%m/%Y)"
          git push
